name: AI Receptionist CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ai-receptionist-github-actions
  EKS_CLUSTER_NAME: ai-receptionist-github-actions-eks
  K8S_NAMESPACE: ai-receptionist

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      # --------------------------------------------------
      # 4. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --------------------------------------------------
      # 5. Install dependencies
      # --------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 6. Run backend tests
      # --------------------------------------------------
      - name: Run backend tests
        working-directory: backend
        run: |
          pytest -v

      # --------------------------------------------------
      # 7. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 8. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend

      # --------------------------------------------------
      # 9. Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --------------------------------------------------
      # 10. Configure kubectl for EKS
      # --------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # --------------------------------------------------
      # 11. Verify EKS access and create namespace
      # --------------------------------------------------
      - name: Verify EKS access and create namespace
        run: |
          kubectl get nodes
          kubectl apply -f k8s/namespace.yml
          kubectl get namespace "$K8S_NAMESPACE"
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      # --------------------------------------------------
      # 12. Update Kubernetes deployment image
      # --------------------------------------------------
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/ai-receptionist \
            ai-receptionist=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/ai-receptionist \
            --timeout=300s

      # --------------------------------------------------
      # 13. Verify deployment
      # --------------------------------------------------
      - name: Verify deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" get deployment
          kubectl -n "$K8S_NAMESPACE" get pods
          kubectl -n "$K8S_NAMESPACE" get service